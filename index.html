<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PLEX</title><meta name="theme-color" content="#7a1f2b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="PLEX">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png">
<style>html,body{margin:0;height:100%;background:#f7f9fc;color:#13213a;font:16px -apple-system,Segoe UI,Roboto,Arial,sans-serif}
#v{position:fixed;inset:0;width:100%;height:100%;border:0;display:none;background:#fff}
#sp{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
#sp .lg{width:84px;height:84px;border-radius:20px;background:#7a1f2b;color:#fff;font-weight:800;font-size:24px;display:flex;align-items:center;justify-content:center;letter-spacing:.04em;box-shadow:0 10px 30px rgba(122,31,43,.25)}
#sp h1{font-size:20px;margin:18px 0 4px;color:#7a1f2b}#sp p{margin:4px 0;color:#3f4f68;font-size:14px}
#bar{width:180px;height:4px;border-radius:4px;background:#e3e8f0;overflow:hidden;margin-top:18px}#bar i{display:block;height:100%;width:35%;background:#7a1f2b;border-radius:4px;animation:m 1.2s ease-in-out infinite}
@keyframes m{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
#key{display:none;margin-top:16px}#key input{font-size:16px;padding:10px 12px;border:1px solid #cfd8e3;border-radius:10px;width:250px}#key button{margin-left:6px;font-size:16px;padding:10px 16px;border:0;border-radius:10px;background:#7a1f2b;color:#fff}
#st{position:fixed;right:10px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:9;font-size:11.5px;background:rgba(255,255,255,.95);border:1px solid #d5deea;border-radius:999px;padding:3px 10px;color:#3f4f68;display:none}
@media (prefers-reduced-motion:reduce){#bar i{animation:none;width:100%}}</style></head>
<body><div id="sp"><div class="lg">PLEX</div><h1>Platinum Explorer</h1><p id="msg">Opening…</p><div id="bar"><i></i></div>
<div id="key"><p>Enter the PLEX access code you were given</p><input id="kin" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="view-…"><button id="kgo">Open</button></div></div>
<iframe id="v" title="PLEX"></iframe><div id="st"></div>
<script>
const API='https://script.google.com/macros/s/AKfycbz9k21GXVGUOFb0EpUkhaCDmTcQAGxaQse5gu8gKSo4iDHinESRWSZdhgEVWehAKM_D/exec';
const $=s=>document.getElementById(s),msg=t=>$('msg').textContent=t;
let KEY=''; try{const m=/[#&]k=([^&]+)/.exec(location.hash);if(m){KEY=decodeURIComponent(m[1]);localStorage.setItem('plexKey',KEY);history.replaceState(null,'',location.pathname);}else KEY=localStorage.getItem('plexKey')||'';}catch(e){}
// small key-value store in IndexedDB (the 6 MB engine is kept on the phone and downloaded again only when a new version is uploaded)
const DB=()=>new Promise((res,rej)=>{const r=indexedDB.open('plex',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
const get=async k=>{try{const d=await DB();return await new Promise(r=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null);});}catch(e){return null;}};
const put=async(k,v)=>{try{const d=await DB();await new Promise(r=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=r;t.onerror=r;});}catch(e){}};
const api=async q=>{const r=await fetch(API+'?'+q+'&key='+encodeURIComponent(KEY),{redirect:'follow'});const j=await r.json();if(!j.ok)throw Object.assign(new Error(j.err||'error'),{bad:j.err==='bad key'});return j;};
const tm=t=>{const d=new Date(t);return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');};
let url='',last=0;
function show(html,note){if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(new Blob([html],{type:'text/html'}));const v=$('v');v.onload=()=>{v.style.display='block';$('sp').style.display='none';};v.src=url;const s=$('st');s.textContent=note;s.style.display='block';setTimeout(()=>s.style.display='none',6000);}
const withBoot=(h,b)=>h.replace('<head>',()=>'<head><script>window.__PLEX_BOOT='+JSON.stringify(b).replace(/</g,'\\u003c')+'<\/script>');
function askKey(t){$('bar').style.display='none';msg(t||'');$('key').style.display='block';$('kgo').onclick=()=>{KEY=$('kin').value.trim();if(!KEY)return;try{localStorage.setItem('plexKey',KEY);}catch(e){}$('key').style.display='none';$('bar').style.display='block';run();};}
async function run(){last=Date.now();if(!KEY)return askKey('');
  try{msg('Getting the latest reports…');const B=await api('get=boot');let E=await get('eng');
    if(B.engineAt){if(!E||E.at!==B.engineAt){msg('Updating PLEX (about 6 MB, only after a new version)…');const e=await api('get=engine');E={at:e.at,html:e.html};await put('eng',E);}
      await put('boot',B.boot);show(withBoot(E.html,B.boot),'Updated '+tm(Date.now()));return;}
    const v=await api('get=view');await put('view',v);show(v.html,'Updated '+tm(v.at));}
  catch(e){if(e.bad){try{localStorage.removeItem('plexKey');}catch(x){}KEY='';return askKey('That access code is not valid.');}
    const E=await get('eng'),b=await get('boot'),v=await get('view');
    if(E&&b)return show(withBoot(E.html,b),'Offline – last copy');if(v)return show(v.html,'Offline – last copy '+tm(v.at));
    msg('No connection and nothing saved yet. Connect once to load PLEX.');}}
run();
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-last>10*60000)run();});
setInterval(()=>{if(!document.hidden)run();},30*60000);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
